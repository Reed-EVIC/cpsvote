name: Weekly Issues Report

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 8:00 AM UTC
  workflow_dispatch:        # Also allows manual trigger from GitHub UI

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Issues Report
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Fetch open issues (excludes pull requests)
          ISSUES=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/issues?state=open&per_page=100" \
            | jq -r '.[] | select(.pull_request == null) | 
              "- **#\(.number)** \(.title) | Assigned: \(.assignee.login // "unassigned") | Created: \(.created_at[:10])"')

          # Count them
          COUNT=$(echo "$ISSUES" | grep -c "^-" || echo 0)

          # Build the report body
          BODY="## 📋 Weekly Issues Report — $(date '+%Y-%m-%d')

          **Open issues: $COUNT**

          $ISSUES

          ---
          *Auto-generated by GitHub Actions*"

          # Post as a new issue
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/issues" \
            -d "{\"title\": \"Weekly Issues Report — $(date '+%Y-%m-%d')\", \"body\": $(echo "$BODY" | jq -Rs .), \"labels\": [\"report\"]}"
