name: Weekly Issues Report
on:
  schedule:
    - cron: '0 15 * * 1'   # Every Monday at 8:00 AM Pacific (UTC-7)
  workflow_dispatch:        # Allows manual trigger from GitHub UI
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Issues Report
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
import json, urllib.request, os
from datetime import datetime, timezone, timedelta

token = os.environ['GH_TOKEN']
repo = os.environ['REPO']

def gh_get(url):
    req = urllib.request.Request(
        url,
        headers={"Authorization": f"token {token}"}
    )
    with urllib.request.urlopen(req) as r:
        return json.loads(r.read())

# Fetch open issues
issues = gh_get(f"https://api.github.com/repos/{repo}/issues?state=open&per_page=100")

# Filter out PRs and report-labeled issues
issues = [i for i in issues
          if "pull_request" not in i
          and not any(l["name"] == "report" for l in i.get("labels", []))]

# Date in Pacific time (UTC-7)
pacific_offset = timedelta(hours=-7)
today = (datetime.now(timezone.utc) + pacific_offset).strftime('%Y-%m-%d')

lines = []
lines.append(f"## Weekly Issues Report - {today}")
lines.append("")
lines.append(f"**Open issues: {len(issues)}**")
lines.append("")

for issue in issues:
    number = issue["number"]
    title = issue["title"]
    assignee = issue["assignee"]["login"] if issue.get("assignee") else "unassigned"
    created = issue["created_at"][:10]
    comment_count = issue["comments"]
    body = issue.get("body") or "No description provided."
    url = issue["html_url"]

    lines.append(f"### #{number} {title}")
    lines.append(f"- Assigned: {assignee} | Created: {created} | Comments: {comment_count}")
    lines.append(f"- URL: {url}")
    lines.append("")
    lines.append("Description:")
    lines.append(body)
    lines.append("")

    if comment_count > 0:
        comments = gh_get(f"https://api.github.com/repos/{repo}/issues/{number}/comments")
        lines.append("Discussion:")
        for c in comments:
            lines.append(f"  {c['user']['login']} ({c['created_at'][:10]}): {c['body']}")
        lines.append("")

    lines.append("---")
    lines.append("")

lines.append("Auto-generated by GitHub Actions")

full_body = "\n".join(lines)

payload = json.dumps({
    "title": f"Weekly Issues Report - {today}",
    "body": full_body,
    "labels": ["report"]
})

req = urllib.request.Request(
    f"https://api.github.com/repos/{repo}/issues",
    data=payload.encode('utf-8'),
    headers={
        "Authorization": f"token {token}",
        "Content-Type": "application/json"
    },
    method="POST"
)
urllib.request.urlopen(req)
print("Issue created successfully.")
PYEOF
