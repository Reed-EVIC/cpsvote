name: Weekly Issues Report
on:
  schedule:
    - cron: '0 15 * * 1'   # Every Monday at 8:00 AM Pacific (UTC-7)
  workflow_dispatch:        # Allows manual trigger from GitHub UI
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Issues Report
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Fetch open issues
          ISSUES_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/issues?state=open&per_page=100")

          # Count excluding pull requests and report issues
          COUNT=$(echo "$ISSUES_JSON" | jq '[.[] | select(.pull_request == null) | select(.labels | map(.name) | contains(["report"]) | not)] | length')

          # Build report body
          BODY="## 📋 Weekly Issues Report — $(TZ='America/Los_Angeles' date '+%Y-%m-%d')\n\n**Open issues: $COUNT**\n\n"

          # Loop through each issue, excluding report-labeled ones
          while IFS= read -r issue; do
            NUMBER=$(echo "$issue" | jq -r '.number')
            TITLE=$(echo "$issue" | jq -r '.title')
            ASSIGNEE=$(echo "$issue" | jq -r '.assignee.login // "unassigned"')
            CREATED=$(echo "$issue" | jq -r '.created_at[:10]')
            COMMENT_COUNT=$(echo "$issue" | jq -r '.comments')
            ISSUE_BODY=$(echo "$issue" | jq -r '.body // "No description provided."')
            URL=$(echo "$issue" | jq -r '.html_url')
            BODY="${BODY}### #${NUMBER} ${TITLE}\n"
            BODY="${BODY}- **Assigned:** ${ASSIGNEE} | **Created:** ${CREATED} | **Comments:** ${COMMENT_COUNT}\n"
            BODY="${BODY}- **URL:** ${URL}\n\n"
            BODY="${BODY}**Description:**\n${ISSUE_BODY}\n\n"
            # Fetch comments if there are any
            if [ "$COMMENT_COUNT" -gt 0 ]; then
              COMMENTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/issues/${NUMBER}/comments" \
                | jq -r '.[] | "> **\(.user.login)** (\(.created_at[:10])): \(.body)"')
              BODY="${BODY}**Discussion:**\n${COMMENTS}\n"
            fi
            BODY="${BODY}\n---\n\n"
          done < <(echo "$ISSUES_JSON" | jq -c '.[] | select(.pull_request == null) | select(.labels | map(.name) | contains(["report"]) | not)')

          BODY="${BODY}*Auto-generated by GitHub Actions*"

          # Post as new issue
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/issues" \
            -d "{
              \"title\": \"Weekly Issues Report — $(TZ='America/Los_Angeles' date '+%Y-%m-%d')\",
              \"body\": \"$BODY\",
              \"labels\": [\"report\"]
            }"
